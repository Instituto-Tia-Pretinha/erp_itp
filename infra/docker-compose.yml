# Fonte única do compose de produção: na VM, ~/itp-stack/docker-compose.yml é
# symlink para este arquivo (~/erp_itp/infra/docker-compose.yml). Editar aqui e
# commitar, nunca direto na VM. Caminhos relativos (./clickhouse-config, ./monitoring,
# *.env) resolvem em ~/itp-stack, onde fica o symlink (conferir com `docker compose config`).
# `name` fixo: sem ele o projeto passaria a se chamar "infra" e o Compose criaria
# volumes novos e vazios (pg_data etc.) em vez de usar os itp-stack_*.
name: itp-stack

services:
  traefik:
    image: traefik:v3.5
    container_name: itp_traefik
    restart: unless-stopped
    mem_limit: 256m
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.leresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.leresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.leresolver.acme.email=erickcardoso@institutotiapretinha.org"
      - "--certificatesresolvers.leresolver.acme.storage=/letsencrypt/acme.json"
      - "--accesslog=true"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt

  postgres:
    image: postgres:17-alpine
    container_name: itp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: itp_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      # Restrito a localhost (decisão 2026-09-16, achado real via catálogo
      # de erros): porta exposta em 0.0.0.0 vinha sendo varrida por
      # bots/scanners tentando logar com o role padrão "postgres"
      # (inexistente aqui, superuser real é itp_admin) -- 22+ itens
      # catalogados entre 09/09 e 09/16, vários criticidade alta, nunca
      # corrigidos. Mesmo padrão já usado em postgres-exporter/
      # blackbox-exporter abaixo. Acesso remoto direto (DBeaver/psql),
      # se necessário, deve usar túnel SSH em vez de porta aberta.
      - "127.0.0.1:5432:5432"

  aprxm_clickhouse:
    image: clickhouse/clickhouse-server:24.10-alpine
    container_name: aprxm_clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: aprxm_analytics
      CLICKHOUSE_USER: aprxm
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-config/backups.xml:/etc/clickhouse-server/config.d/backups.xml:ro
      - ./clickhouse-config/logs-reduzidos.xml:/etc/clickhouse-server/config.d/logs-reduzidos.xml:ro
      - /home/itpadmin/backups:/backups
    # 1g -> 1.5g (2026-09-17): container batia no teto so com overhead
    # interno do ClickHouse (mark cache/uncompressed cache), mesmo com
    # tabelas gold pequenas -- ate "SELECT count() FROM system.merges"
    # falhava com MEMORY_LIMIT_EXCEEDED. Achado testando a conexao do BI.
    mem_limit: 1.5g
    cpus: "1.0"
    networks:
      default:
        aliases:
          - clickhouse-bi

  erp_itp_backend:
    build:
      context: /home/itpadmin/erp_itp/apps/backend
    container_name: erp_itp_backend
    restart: unless-stopped
    mem_limit: 1g
    env_file:
      - erp_itp_backend.env
    depends_on:
      - postgres
    ports:
      - "3001:3001"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.erpitp-backend.rule=Host(`api.itp.institutotiapretinha.org`)"
      - "traefik.http.routers.erpitp-backend.entrypoints=websecure"
      - "traefik.http.routers.erpitp-backend.tls.certresolver=leresolver"
      - "traefik.http.services.erpitp-backend.loadbalancer.server.port=3001"

  erp_itp_frontend:
    build:
      context: /home/itpadmin/erp_itp/apps/frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /backend-api
        NEXT_PUBLIC_COLETOR_TOKEN: itp-coletor-2026
        NEXT_PUBLIC_CHAMADA_TOKEN: itp-chamada-2026
    container_name: erp_itp_frontend
    restart: unless-stopped
    mem_limit: 1g
    env_file:
      - erp_itp_frontend.env
    depends_on:
      - erp_itp_backend
    ports:
      - "3000:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.erpitp-frontend.rule=Host(`itp.institutotiapretinha.org`)"
      - "traefik.http.routers.erpitp-frontend.entrypoints=websecure"
      - "traefik.http.routers.erpitp-frontend.tls.certresolver=leresolver"
      - "traefik.http.services.erpitp-frontend.loadbalancer.server.port=3000"

  aprxm_presidencia:
    build:
      context: /home/itpadmin/aprxm_sys
      dockerfile: presidencia/Dockerfile
    container_name: aprxm_presidencia
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      - aprxm_backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aprxm-presidencia.rule=Host(`aprxm.institutotiapretinha.org`)"
      - "traefik.http.routers.aprxm-presidencia.entrypoints=websecure"
      - "traefik.http.routers.aprxm-presidencia.tls.certresolver=leresolver"
      - "traefik.http.services.aprxm-presidencia.loadbalancer.server.port=80"

  aprxm_backend:
    build:
      context: /home/itpadmin/aprxm_sys/backend
    container_name: aprxm_backend
    restart: unless-stopped
    env_file:
      - aprxm_backend.env
    mem_limit: 2g
    ports:
      - "127.0.0.1:8003:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aprxm-backend.rule=Host(`api-aprxm.institutotiapretinha.org`)"
      - "traefik.http.routers.aprxm-backend.entrypoints=websecure"
      - "traefik.http.routers.aprxm-backend.tls.certresolver=leresolver"
      - "traefik.http.services.aprxm-backend.loadbalancer.server.port=8000"

  catalogo_backend:
    build:
      context: /home/itpadmin/erp_itp/catalogo-erros-viewer/backend
    container_name: catalogo_backend
    restart: unless-stopped
    mem_limit: 1g
    env_file:
      - /home/itpadmin/itp-stack/catalogo_erros.env
    volumes:
      - /home/itpadmin/itp-stack/catalogo-erros-parquet:/root/itp-stack/catalogo-erros-parquet:ro
    environment:
      PARQUET_BASE_DIR: /root/itp-stack/catalogo-erros-parquet
      TAREFAS_API_URL: http://host.docker.internal:8002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8001:8000"

  catalogo_frontend:
    build:
      context: /home/itpadmin/erp_itp/catalogo-erros-viewer/frontend
      args:
        BACKEND_INTERNAL_URL: http://catalogo_backend:8000
    container_name: catalogo_frontend
    restart: unless-stopped
    mem_limit: 512m
    environment:
      BACKEND_INTERNAL_URL: http://catalogo_backend:8000
      MS_TENANT_ID: ${MS_TENANT_ID}
      MS_CLIENT_ID: ${MS_CLIENT_ID}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET}
      MS_REDIRECT_URI: http://localhost:8080/api/auth/callback
      SESSION_SECRET: ${ITP_TEC_SESSION_SECRET}
    depends_on:
      - catalogo_backend
    ports:
      - "127.0.0.1:8080:3000"


  node-exporter:
    image: prom/node-exporter:latest
    container_name: itp_node_exporter
    restart: unless-stopped
    mem_limit: 128m
    command:
      - '--path.rootfs=/host'
      - '--collector.textfile.directory=/textfile-metrics'
    volumes:
      - '/:/host:ro,rslave'
      - './textfile-metrics:/textfile-metrics:ro'
    ports:
      - "127.0.0.1:9100:9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: itp_cadvisor
    restart: unless-stopped
    mem_limit: 512m
    # Só containers Docker, coleta a cada 30s e sem as métricas que nenhum painel/alerta
    # usa (painéis usam só cpu, memória, rede, last_seen e start_time). Era o container
    # mais caro da VM: ~18% de CPU e 73 GB enviados ao Prometheus (2026-10-16).
    command:
      - '--docker_only=true'
      - '--housekeeping_interval=30s'
      - '--store_container_labels=false'
      - '--disable_metrics=percpu,sched,tcp,udp,advtcp,referenced_memory,hugetlb,cpu_topology,resctrl,memory_numa,disk,process'
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:8082:8080"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: itp_postgres_exporter
    restart: unless-stopped
    mem_limit: 128m
    environment:
      DATA_SOURCE_NAME: "postgresql://itp_admin:${POSTGRES_PASSWORD}@postgres:5432/erp_itp_db?sslmode=disable"
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:9187:9187"

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: itp_blackbox_exporter
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - ./monitoring/prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml
    ports:
      - "127.0.0.1:9115:9115"

  prometheus:
    image: prom/prometheus:latest
    container_name: itp_prometheus
    restart: unless-stopped
    mem_limit: 2g
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "127.0.0.1:9091:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: itp_grafana
    restart: unless-stopped
    mem_limit: 1g
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.itp.institutotiapretinha.org
      # SSO Microsoft — reaproveita o mesmo app registration do erp_itp
      # (credenciais copiadas pro .env do itp-stack). Redirect URI a
      # cadastrar no Entra: https://grafana.itp.institutotiapretinha.org/login/azuread
      GF_AUTH_AZUREAD_ENABLED: "true"
      GF_AUTH_AZUREAD_NAME: "Microsoft (Instituto)"
      GF_AUTH_AZUREAD_CLIENT_ID: ${MS_CLIENT_ID}
      GF_AUTH_AZUREAD_CLIENT_SECRET: ${MS_CLIENT_SECRET}
      GF_AUTH_AZUREAD_SCOPES: "openid email profile"
      GF_AUTH_AZUREAD_AUTH_URL: https://login.microsoftonline.com/${MS_TENANT_ID}/oauth2/v2.0/authorize
      GF_AUTH_AZUREAD_TOKEN_URL: https://login.microsoftonline.com/${MS_TENANT_ID}/oauth2/v2.0/token
      GF_AUTH_AZUREAD_ALLOWED_ORGANIZATIONS: ${MS_TENANT_ID}
      GF_AUTH_AZUREAD_ALLOW_SIGN_UP: "true"
      GF_RENDERING_SERVER_URL: http://grafana_renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: ${GRAFANA_RENDERER_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/dashboards-json:/etc/grafana/provisioning/dashboards-json
      - ./monitoring/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3030:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.itp.institutotiapretinha.org`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=leresolver"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  grafana_renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: itp_grafana_renderer
    restart: unless-stopped
    mem_limit: 1g
    environment:
      ENABLE_METRICS: "false"
      AUTH_TOKEN: ${GRAFANA_RENDERER_TOKEN}
      CALLBACK_URL: http://grafana:3000/
      HTTP_HOST: 0.0.0.0


volumes:
  pg_data:
  clickhouse_data:
  traefik_letsencrypt:
  prometheus_data:
  grafana_data:
