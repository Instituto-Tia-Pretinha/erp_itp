apiVersion: 1

groups:
  - orgId: 1
    name: itp-alertas-criticos
    folder: ITP
    interval: 1m
    rules:
      - uid: itp-alerta-site-fora-do-ar
        title: Site ou API fora do ar
        condition: C
        for: 2m
        no_data_state: Alerting
        exec_err_state: Alerting
        labels:
          severity: critical
        annotations:
          summary: "O QUE ACONTECEU:\nUm dos dominios publicos monitorados (site, API ou sistema ITP) parou de responder ao probe.\n\nPOR QUE IMPORTA:\nUsuarios externos provavelmente nao conseguem acessar o servico agora.\n\nO QUE FAZER:\n1. Confirmar no navegador se o dominio esta mesmo fora do ar\n2. Checar se o container/servico correspondente esta rodando na VM\n3. Ver logs do servico e do proxy reverso (nginx/traefik) para a causa"
        data:
          - refId: A
            datasourceUid: prometheus_itp
            relativeTimeRange: { from: 300, to: 0 }
            model:
              editorMode: code
              expr: probe_success
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
              refId: C

      - uid: itp-alerta-disco-cheio
        title: Disco quase cheio (acima de 90%)
        condition: C
        for: 5m
        no_data_state: Alerting
        exec_err_state: Alerting
        labels:
          severity: critical
        annotations:
          summary: "O QUE ACONTECEU:\nO disco principal da VM esta acima de 90% de uso.\n\nPOR QUE IMPORTA:\nSem espaco livre, bancos, backups e logs podem parar de gravar e derrubar o sistema.\n\nO QUE FAZER:\n1. Rodar df -h e du -sh para achar o que esta ocupando espaco\n2. Limpar logs antigos, backups vencidos ou imagens Docker nao usadas (docker system prune)\n3. Se for crescimento normal, avaliar aumentar o disco da VM"
        data:
          - refId: A
            datasourceUid: prometheus_itp
            relativeTimeRange: { from: 300, to: 0 }
            model:
              editorMode: code
              expr: 100 - ((node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100)
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
              refId: C

      - uid: itp-alerta-memoria-critica
        title: Memória disponível crítica (abaixo de 10%)
        condition: C
        for: 5m
        no_data_state: Alerting
        exec_err_state: Alerting
        labels:
          severity: critical
        annotations:
          summary: "O QUE ACONTECEU:\nA memoria disponivel da VM caiu abaixo de 10%.\n\nPOR QUE IMPORTA:\nO Linux pode comecar a matar processos automaticamente (OOM killer), incluindo containers em producao.\n\nO QUE FAZER:\n1. Rodar docker stats para achar qual container esta consumindo mais memoria\n2. Verificar se e pico pontual (ex: ETL/backup rodando) ou vazamento continuo\n3. Reiniciar o container problematico se for vazamento, ou aumentar mem_limit se for uso legitimo"
        data:
          - refId: A
            datasourceUid: prometheus_itp
            relativeTimeRange: { from: 300, to: 0 }
            model:
              editorMode: code
              expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [10] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
              refId: C

      - uid: itp-alerta-swap-alto
        title: Uso de swap alto (acima de 50%)
        condition: C
        for: 15m
        no_data_state: OK
        exec_err_state: Alerting
        labels:
          severity: warning
        annotations:
          summary: "O QUE ACONTECEU:\nO swap da VM esta acima de 50% ha mais de 15 minutos.\n\nPOR QUE IMPORTA:\nSwap alto e persistente indica falta de memoria real: o sistema fica lento e pode chegar ao OOM killer. Cache alto (buff/cache) NAO e problema; swap crescendo e.\n\nO QUE FAZER:\n1. Rodar free -h e olhar a coluna available\n2. Rodar docker stats para achar o container que mais cresceu\n3. Se for vazamento, reiniciar o container; se for uso legitimo, rever mem_limit ou a memoria da VM"
        data:
          - refId: A
            datasourceUid: prometheus_itp
            relativeTimeRange: { from: 300, to: 0 }
            model:
              editorMode: code
              expr: 100 * (1 - node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes)
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [50] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
              refId: C

      - uid: itp-alerta-container-caido
        title: Um serviço (container) parou de responder
        condition: C
        for: 2m
        no_data_state: Alerting
        exec_err_state: Alerting
        labels:
          severity: critical
        annotations:
          summary: "O QUE ACONTECEU:\nUm dos servicos Docker parou de reportar metricas ha mais de 5 minutos.\n\nPOR QUE IMPORTA:\nProvavelmente o container caiu ou esta em loop de reinicio, sem processar nada.\n\nO QUE FAZER:\n1. Rodar docker ps -a para ver qual container esta down/reiniciando\n2. Checar docker logs <container> para o erro real\n3. Corrigir a causa e rodar docker compose up -d --force-recreate <container>"
        data:
          - refId: A
            datasourceUid: prometheus_itp
            relativeTimeRange: { from: 300, to: 0 }
            model:
              editorMode: code
              expr: max by (name) (time() - container_last_seen{name!=""})
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                # Achado real 2026-09-14: threshold de 120s + "for: 2m" (total
                # ~4min) disparava em TODO redeploy normal (docker compose build
                # + up -d --force-recreate) de qualquer app, gerando 8+ emails
                # de falso alarme num unico dia de trabalho -- container_last_seen
                # do cAdvisor demora mais que 2min pra "esquecer" um container
                # recriado em alguns casos (rebuild de imagem incluido). Subido
                # pra 300s (~7min total com o "for") -- ainda rapido o bastante
                # pra pegar crash-loop/queda real, mas tolera deploy manual sem
                # spam.
                - evaluator: { type: gt, params: [300] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
              refId: C

      - uid: itp-alerta-taxa-erro-http
        title: Muitos erros de usuário em pouco tempo (5xx)
        condition: C
        for: 3m
        no_data_state: Alerting
        exec_err_state: Alerting
        labels:
          severity: warning
        annotations:
          summary: "O QUE ACONTECEU:\nMais de 20% das requisicoes HTTP dos ultimos 5 minutos retornaram erro de servidor (5xx).\n\nPOR QUE IMPORTA:\nUsuarios reais estao vendo erro ao usar o sistema agora, nao e so um teste isolado.\n\nO QUE FAZER:\n1. Checar logs do backend para o erro mais frequente no periodo\n2. Ver se coincide com algum deploy recente\n3. Se for regressao de deploy, avaliar reverter enquanto investiga"
        data:
          - refId: A
            datasourceUid: prometheus_itp
            relativeTimeRange: { from: 300, to: 0 }
            model:
              editorMode: code
              expr: (sum(rate(http_requests_total{status_code=~"5.."}[5m])) or vector(0)) / (sum(rate(http_requests_total[5m])) or vector(1)) * 100
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [20] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
              refId: C

      - uid: itp-alerta-coletor-erros-parado
        title: Coletor de erros (catálogo) sem execução recente
        condition: C
        for: 1m
        no_data_state: Alerting
        exec_err_state: Alerting
        labels:
          severity: warning
        annotations:
          summary: "O QUE ACONTECEU:\nO coletor de erros nao registrou nenhuma execucao nos ultimos 15 minutos (deveria rodar a cada 5 min).\n\nCAUSA PROVAVEL:\nO processo travou antes de gravar o heartbeat, ou o cron parou de disparar.\n\nO QUE FAZER:\n1. Verificar se o processo esta rodando: ps aux | grep coletor.py\n2. Checar o log: ~/itp-stack/catalogo-erros-cron.log\n3. Se travado, matar o processo e conferir os locks em ~/itp-stack/*.lock"
        data:
          - refId: A
            datasourceUid: prometheus_itp
            relativeTimeRange: { from: 300, to: 0 }
            model:
              editorMode: code
              expr: time() - tarefa_ultima_execucao_timestamp_seconds{tarefa="catalogo-erros-coletor"}
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [900] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
              refId: C

      - uid: itp-alerta-catalogo-teto-classificacoes
        title: Catálogo de erros — teto de classificações atingido repetidamente
        condition: C
        for: 30m
        no_data_state: OK
        exec_err_state: Alerting
        labels:
          severity: warning
        annotations:
          summary: "O QUE ACONTECEU:\nO coletor de erros bateu no teto de 5 classificacoes por rodada, com dado atualizado ha menos de 30 minutos (nao e valor antigo travado).\n\nPOR QUE IMPORTA:\nIsso indica backlog real de erros se acumulando, nao so um pico pontual.\n\nO QUE FAZER:\n1. Ver quantos erros novos entraram recentemente no catalogo\n2. Se for volume real, considerar aumentar o limite por rodada (LIMITE_CLASSIFICACOES_POR_RODADA em coletor.py)\n3. Se for erro repetido do mesmo tipo, investigar a causa raiz em vez de so aumentar o limite"
        data:
          - refId: A
            datasourceUid: prometheus_itp
            relativeTimeRange: { from: 300, to: 0 }
            model:
              editorMode: code
              expr: 'catalogo_erros_teto_atingido * scalar(time() - node_textfile_mtime_seconds{file="/textfile-metrics/catalogo-erros-teto.prom"} < bool 1800)'
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
              refId: C

      - uid: itp-alerta-tarefa-atrasada
        title: Tarefa agendada sem rodar no prazo
        condition: C
        for: 5m
        no_data_state: OK
        exec_err_state: Alerting
        labels:
          severity: warning
        annotations:
          summary: "O QUE ACONTECEU:\nA tarefa {{ $labels.tarefa }} passou do prazo sem nenhuma execucao (diaria: 26h; a cada 6h: 7h; investigador/sync: 2h; semanal: 8 dias; mensal: 32 dias).\n\nCAUSA PROVAVEL:\nLinha do crontab removida ou alterada, ou o runner nao chega a rodar.\n\nO QUE FAZER:\n1. crontab -l | grep {{ $labels.tarefa }}\n2. Conferir ~/itp-stack/tarefas-timing/{{ $labels.tarefa }}.jsonl\n3. Rodar na mao: /opt/itp-stack/tarefas-venv/bin/python3 /opt/itp-stack/tarefas_runner.py {{ $labels.tarefa }}"
        data:
          - refId: A
            datasourceUid: prometheus_itp
            relativeTimeRange: { from: 300, to: 0 }
            model:
              editorMode: code
              expr: '(time() - tarefa_ultima_execucao_timestamp_seconds{tarefa=~"catalogo-erros-consolidacao-diaria|aprxm-etl|aprxm-mensalidade-overdue|aprxm-crm-scoring|aprxm-demands-reminders|aprxm-blob-backup-to-sharepoint|vm-snapshot|log-daily-zip|verificar-senhas|supabase-health-check|captacao-cron-expire"}) / 93600 or (time() - tarefa_ultima_execucao_timestamp_seconds{tarefa=~"pg-sync-to-neon|aprxm-backup-to-neon|aprxm-clickhouse-backup"}) / 25200 or (time() - tarefa_ultima_execucao_timestamp_seconds{tarefa=~"jiraia-investigador|sync-catalogo-erros-clickhouse"}) / 7200 or (time() - tarefa_ultima_execucao_timestamp_seconds{tarefa=~"aprxm-vacuum|relatorio-grafana"}) / 691200 or (time() - tarefa_ultima_execucao_timestamp_seconds{tarefa="aprxm-mensalidade-generate"}) / 2764800'
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
              refId: C

      - uid: itp-alerta-tarefa-falhou
        title: Tarefa agendada terminou com erro
        condition: C
        for: 5m
        no_data_state: OK
        exec_err_state: Alerting
        labels:
          severity: warning
        annotations:
          summary: "O QUE ACONTECEU:\nA ultima execucao da tarefa {{ $labels.tarefa }} terminou com exit code diferente de 0.\n\nO QUE FAZER:\n1. Ver o log da tarefa (log_path em ~/itp-stack/tarefas-registro.json)\n2. Conferir ~/itp-stack/tarefas-timing/{{ $labels.tarefa }}.jsonl\n3. Corrigir e rodar de novo pelo runner"
        data:
          - refId: A
            datasourceUid: prometheus_itp
            relativeTimeRange: { from: 300, to: 0 }
            model:
              editorMode: code
              expr: 'tarefa_ultimo_exit_code{tarefa!~"catalogo-erros-aplicador|aprxm-sync-pix|aprxm-daily-tasks-reminders"}'
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
              refId: C

# Exclusão real de regra provisionada por arquivo (decisão 2026-09-15):
# só tirar do bloco "groups" acima NÃO apaga a regra -- Grafana 13.2.1
# mantém servindo a versão antiga do banco interno mesmo depois de
# restart/reload (achado real, 2 tentativas nesta mesma investigação).
# O mecanismo oficial de exclusão do provisionamento por arquivo é essa
# seção deleteRules — mantém aqui permanentemente (reaplicar não dá erro
# se já estiver apagada) como registro de que essa regra foi removida de
# propósito, não esquecida.
deleteRules:
  - orgId: 1
    uid: itp-alerta-catalogo-escalonamento
